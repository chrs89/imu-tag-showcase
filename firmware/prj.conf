CONFIG_NCS_APPLICATION_BOOT_BANNER_STRING="IMU Tag showcase"

# Logging
CONFIG_LOG=y
CONFIG_LOG_MODE_DEFERRED=y
CONFIG_LOG_DEFAULT_LEVEL=2
CONFIG_CBPRINTF_FP_SUPPORT=y

# Use Segger RTT for console (no UART needed on custom board)
CONFIG_STDOUT_CONSOLE=y
CONFIG_UART_CONSOLE=n
CONFIG_USE_SEGGER_RTT=y
CONFIG_RTT_CONSOLE=y

# HW
CONFIG_HWINFO=y

# IMU (wiki chapter 8, ADR-004): the upstream driver probes the LSM6DSV16X at
# boot and brings in the ST HAL; imu_ext owns the registers afterwards.
# TRIGGER_NONE keeps the driver away from INT1 and INT2, which the
# application handles itself.
CONFIG_SPI=y
CONFIG_SENSOR=y
CONFIG_LSM6DSV16X=y
CONFIG_LSM6DSV16X_TRIGGER_NONE=y

# FPU (wiki chapter 10): hardware single-precision float with the hard-float
# ABI. Sharing is needed because more than one thread computes in float:
# burst_proc (orientation filter) and app_wq (magnetometer scaling,
# calibration).
CONFIG_FPU=y
CONFIG_FPU_SHARING=y

# Calibration store (wiki chapter 10): settings subsystem on NVS in the
# Partition Manager partition settings_storage. The LIS2MDL driver needs no
# line here: CONFIG_LIS2MDL defaults to y with the devicetree node.
CONFIG_FLASH=y
CONFIG_FLASH_MAP=y
CONFIG_NVS=y
CONFIG_SETTINGS=y
