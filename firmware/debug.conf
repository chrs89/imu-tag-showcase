# Thread analyzer overlay, chapter 3. Not part of the default build:
# west build -p -b imu_tag_v1/nrf52840 --sysbuild firmware -- "-DEXTRA_CONF_FILE=debug.conf"
CONFIG_THREAD_NAME=y
CONFIG_THREAD_MONITOR=y
CONFIG_INIT_STACKS=y
CONFIG_THREAD_STACK_INFO=y
CONFIG_THREAD_ANALYZER=y
CONFIG_THREAD_ANALYZER_USE_LOG=y
# Analyzer prints with LOG_INF; prj.conf's CONFIG_LOG_DEFAULT_LEVEL=2 would silence it.
CONFIG_THREAD_ANALYZER_LOG_LEVEL_INF=y
# The analyzer queues about twelve messages at once from main. The default
# 1024-byte log buffer drops the tail and the 768-byte logging stack sits
# at 68 % before them; both only in this overlay.
CONFIG_LOG_BUFFER_SIZE=4096
CONFIG_LOG_PROCESS_THREAD_STACK_SIZE=2048
# Enable debug counters for IMU tag
CONFIG_IMU_TAG_DEBUG_COUNTERS=y
# Chapter 5, M-05-2: DWT cycle counter for the stats handler timing.
CONFIG_TIMING_FUNCTIONS=y
