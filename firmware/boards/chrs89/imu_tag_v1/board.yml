board:
  name: imu_tag_v1
  full_name: "IMU Tag v1 (E73-2G4M08S1C)"
  vendor: chrs89
  socs:
    - name: nrf52840
  revision:
    format: major.minor.patch
    default: "1.0.0"
    revisions:
      # 1.0.0 — baseline PCBA: GD25Q64ESIG (GigaDevice) QSPI NOR flash.
      # Devicetree lives in imu_tag_v1_nrf52840.dts (no revision suffix).
      - name: "1.0.0"
      # 1.1.0 — QSPI flash BOM change: MX25R6435F (Macronix) replaces
      # GD25Q64ESIG. Same footprint/pinout/8 MB class, different JEDEC ID
      # and DPD timing — see imu_tag_v1_nrf52840_1_1_0.overlay. Build with
      # `west build -b imu_tag_v1@1.1.0/nrf52840`.
      - name: "1.1.0"
